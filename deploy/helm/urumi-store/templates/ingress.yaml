apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  labels: {{ include "store.labels" . | nindent 4 }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.store.host | quote }}]
      secretName: {{ default (printf "%s-tls" .Values.store.slug) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.store.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
