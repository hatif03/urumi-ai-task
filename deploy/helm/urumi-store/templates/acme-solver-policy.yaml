{{- if and .Values.ingress.tls.enabled .Values.ingress.tls.clusterIssuer }}
{{- /* Lets cert-manager's HTTP-01 solver pod be reached through ingress-nginx despite the default-deny policies. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-http01-solver
  labels: {{ include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8089 }
{{- end }}
