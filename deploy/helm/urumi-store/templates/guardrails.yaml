apiVersion: v1
kind: ResourceQuota
metadata:
  name: store-quota
  labels: {{ include "store.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory | quote }}
    limits.cpu: {{ .Values.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.quota.limitsMemory | quote }}
    persistentvolumeclaims: {{ .Values.quota.pvcs | quote }}
    requests.storage: {{ .Values.quota.storage | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: store-limits
  labels: {{ include "store.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest: {{ toYaml .Values.limitRange.defaultRequest | nindent 8 }}
      default: {{ toYaml .Values.limitRange.default | nindent 8 }}
