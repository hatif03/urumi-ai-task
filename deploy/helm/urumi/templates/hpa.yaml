{{- if not .Values.skeletonOnly }}
{{- $max := .Values.hpa.localMax }}
{{- if .Values.hpa.useProdMax }}{{ $max = .Values.hpa.prodMax }}{{ end }}
{{- range $target := list
  (dict "name" "gateway" "namespace" "platform" "min" $.Values.replicas.gateway)
  (dict "name" "dashboard" "namespace" "platform" "min" $.Values.replicas.dashboard)
  (dict "name" "woocommerce-mcp" "namespace" "store" "min" $.Values.replicas.mcp)
  (dict "name" "utility-mcp" "namespace" "platform" "min" $.Values.replicas.mcp)
  (dict "name" "policy-mcp" "namespace" "platform" "min" $.Values.replicas.mcp) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $target.name }}
  namespace: {{ $target.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $target.name }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $target.name }}
  namespace: {{ $target.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $target.name }}
  minReplicas: {{ $target.min }}
  maxReplicas: {{ $max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.hpa.cpu }}
---
{{- end }}
{{- end }}
