{{- if not .Values.skeletonOnly }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: store
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: store
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-ingress
  namespace: store
spec:
  podSelector:
    matchLabels:
      app: wordpress
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 80 }
    - from:
        - podSelector:
            matchLabels:
              app: woocommerce-mcp
      ports:
        - { protocol: TCP, port: 80 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-egress
  namespace: store
spec:
  podSelector:
    matchLabels:
      app: wordpress
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mariadb
      ports:
        - { protocol: TCP, port: 3306 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-ingress
  namespace: store
spec:
  podSelector:
    matchLabels:
      app: mariadb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: wordpress
        - podSelector:
            matchLabels:
              app: store-bootstrap
      ports:
        - { protocol: TCP, port: 3306 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap-egress
  namespace: store
spec:
  podSelector:
    matchLabels:
      app: store-bootstrap
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mariadb
      ports:
        - { protocol: TCP, port: 3306 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woocommerce-mcp
  namespace: store
spec:
  podSelector:
    matchLabels:
      app: woocommerce-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              app: gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 9090 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: wordpress
      ports:
        - { protocol: TCP, port: 80 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
          podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - { protocol: TCP, port: 4318 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - { protocol: TCP, port: 9090 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels:
              app: utility-mcp
        - podSelector:
            matchLabels:
              app: policy-mcp
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 4318 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store
          podSelector:
            matchLabels:
              app: woocommerce-mcp
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: extra-mcp
  namespace: platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [utility-mcp, policy-mcp]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 9090 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: otel-collector
      ports:
        - { protocol: TCP, port: 4318 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app: dashboard
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability
  namespace: platform
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [prometheus, grafana, tempo, otel-collector]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 9090 }
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 3200 }
        - { protocol: TCP, port: 4318 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store
      ports:
        - { protocol: TCP, port: 4318 }
  egress:
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 9090 }
        - { protocol: TCP, port: 3200 }
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 8080 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store
      ports:
        - { protocol: TCP, port: 9090 }
{{- end }}
