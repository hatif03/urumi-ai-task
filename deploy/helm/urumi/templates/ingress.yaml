{{- if .Values.skeletonOnly }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skeleton
  namespace: store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skeleton
  template:
    metadata:
      labels:
        app: skeleton
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.images.skeleton.repository }}:{{ .Values.images.skeleton.tag }}"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          livenessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: skeleton
  namespace: store
spec:
  selector:
    app: skeleton
  ports:
    - port: 80
      targetPort: 80
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: store
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.shopHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                {{- if .Values.skeletonOnly }}
                name: skeleton
                {{- else }}
                name: wordpress
                {{- end }}
                port:
                  number: 80
---
{{- if not .Values.skeletonOnly }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.dashboardHost }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
{{- end }}
