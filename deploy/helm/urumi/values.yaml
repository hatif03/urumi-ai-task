skeletonOnly: false

ingress:
  className: nginx
  shopHost: shop.local
  dashboardHost: dashboard.local
  tls:
    enabled: false
    secretName: ""

persistence:
  storageClass: local-path
  mariadb: 5Gi
  wordpress: 5Gi
  postgres: 5Gi
  prometheus: 2Gi
  tempo: 1Gi

images:
  mariadb: { repository: mariadb, tag: "11.4", pullPolicy: IfNotPresent }
  wordpress: { repository: wordpress, tag: "7.1.3-apache", pullPolicy: IfNotPresent }
  wordpressCli: { repository: wordpress, tag: "cli-2.12.0-php8.3", pullPolicy: IfNotPresent }
  postgres: { repository: postgres, tag: "16-alpine", pullPolicy: IfNotPresent }
  gateway: { repository: urumi-gateway, tag: local, pullPolicy: Never }
  dashboard: { repository: urumi-dashboard, tag: local, pullPolicy: Never }
  woocommerceMcp: { repository: urumi-woocommerce-mcp, tag: local, pullPolicy: Never }
  utilityMcp: { repository: urumi-utility-mcp, tag: local, pullPolicy: Never }
  policyMcp: { repository: urumi-policy-mcp, tag: local, pullPolicy: Never }
  prometheus: { repository: prom/prometheus, tag: v2.55.1, pullPolicy: IfNotPresent }
  grafana: { repository: grafana/grafana, tag: "11.3.0", pullPolicy: IfNotPresent }
  tempo: { repository: grafana/tempo, tag: "2.6.1", pullPolicy: IfNotPresent }
  collector: { repository: otel/opentelemetry-collector-contrib, tag: "0.111.0", pullPolicy: IfNotPresent }
  skeleton: { repository: nginx, tag: "1.27-alpine", pullPolicy: IfNotPresent }

replicas:
  gateway: 2
  mcp: 2
  dashboard: 2

hpa:
  cpu: 70
  localMax: 2
  prodMax: 4
  useProdMax: false

secrets:
  storeDb: store-db
  storeAdmin: store-admin
  storeWcApi: store-wc-api
  gatewayBootstrap: gateway-bootstrap
  gatewaySecrets: gateway-secrets
  gatewayLlm: gateway-llm

wordpress:
  url: http://shop.local
  dbName: wordpress
  dbUser: wordpress

seedServers: "woocommerce|WooCommerce|http://woocommerce-mcp.store.svc.cluster.local:8080/mcp,utility|Utility|http://utility-mcp.platform.svc.cluster.local:8080/mcp,policy|Policy|http://policy-mcp.platform.svc.cluster.local:8080/mcp"

resources:
  mariadb: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  wordpress: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
  bootstrap: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
  postgres: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
  gateway: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
  mcp: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } }
  dashboard: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
  prometheus: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 300m, memory: 512Mi } }
  grafana: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
  tempo: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
  collector: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
